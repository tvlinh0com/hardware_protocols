name: Build Library

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  BUILD_TYPE: Release

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run clang-format check
        uses: jidicula/clang-format-action@v4.18.0
        with:
          check-path: '.'
          include-regex: '^.*\.(h|hpp|c|cpp)$'

  build:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install libusb dependency
      run: |
        sudo apt-get update
        sudo apt-get install libusb-1.0.0-dev pkg-config -y

    - name: Configure CMake
      # run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_STANDARD=20
      run: cmake --preset "default" -DHWPLIB_BUILD_EXAMPLE=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}
